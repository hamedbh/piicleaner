[package]
name = "piicleaner"
version = "0.7.0-dev.0"
edition = "2021"

[lib]
name = "piicleaner"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29.3", features = ["extension-module", "abi3-py311"] }
rayon = "1.10"
regex = "1.11"

[dev-dependencies]
criterion = "0.6.0"

[[bench]]
name = "benchmarks"
harness = false
