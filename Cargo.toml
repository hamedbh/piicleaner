[package]
name = "piicleaner"
version = "0.7.1-dev.0"
edition = "2024"
# The oldest Rust the dependencies build with (sysinfo, via Polars, needs
# 1.95). CI checks the crate builds with it
rust-version = "1.95"

[lib]
name = "piicleaner"
crate-type = ["cdylib", "rlib"]

[dependencies]
polars-arrow = { version = "0.55.1", default-features = false }
# Every dtype Python Polars can pass in must be readable, so a non-string
# column gets a clear error instead of a panic
polars-core = { version = "0.55.1", default-features = false, features = [
    "dtype-array",
    "dtype-categorical",
    "dtype-decimal",
    "dtype-f16",
    "dtype-i128",
    "dtype-struct",
    "dtype-u128",
] }
polars-error = "0.55.1"
polars-ffi = "0.55.1"
pyo3 = { version = "0.29.3", features = ["extension-module", "abi3-py311"] }
pyo3-polars = { version = "0.28.0", features = ["derive"] }
rayon = "1.10"
regex = "1.11"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
criterion = "0.6.0"

[[bench]]
name = "benchmarks"
harness = false
