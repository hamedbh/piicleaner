name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Build the extension once per OS and run the Rust tests. The extension
  # uses the stable ABI (abi3), so the same wheel installs on every Python
  # version the test job covers
  build:
    name: Build wheel and run Rust tests (${{ matrix.os }})
    strategy:
      # A runner fault on one OS shouldn't cancel the others
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v10.3.0
      with:
        version: "latest"
        enable-cache: true
        cache-dependency-glob: "**/uv.lock"
        cache-suffix: "${{ matrix.os }}-build"

    # The oldest supported Python, which the abi3 wheel targets
    - name: Set up Python 3.11
      run: uv python install 3.11

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    # All of target/ and ~/.cargo, so the wheel build is warm. rust-cache
    # left pyo3 and most of Polars to recompile on every run (#94)
    - name: Cache Rust dependencies
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: ${{ runner.os }}-cargo-

    - name: Build wheel
      run: uv build --wheel --python 3.11 --out-dir dist

    # A bare venv gives pyo3 an interpreter without building the package.
    # The tests compile the dependencies in the debug profile (release
    # wouldn't reuse the wheel's build: dev-dependencies change features in
    # shared crates). Without debug info that's ~25% quicker, and the build
    # is a third of the size
    - name: Run Rust tests
      env:
        CARGO_PROFILE_DEV_DEBUG: 0
      run: |
        uv venv --python 3.11
        uv run --no-sync cargo test

    - name: Store wheel
      uses: actions/upload-artifact@v7
      with:
        name: wheel-${{ matrix.os }}
        path: dist/*.whl

  # Lint and format checks for Python and Rust, once, on one OS
  lint:
    name: Lint and format
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v10.3.0
      with:
        version: "latest"
        enable-cache: true
        cache-dependency-glob: "**/uv.lock"
        cache-suffix: "lint"

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2

    - name: Install dev dependencies
      run: uv sync --dev --no-install-project --python 3.11

    - name: ruff check
      run: uv run --no-sync ruff check

    - name: ruff format --check
      run: uv run --no-sync ruff format --check

    - name: cargo fmt --check
      run: cargo fmt --check

    # pyo3's build script needs a Python interpreter, from the venv above
    - name: cargo clippy
      run: uv run --no-sync cargo clippy --all-targets -- -D warnings

  # Check the crate builds with the oldest supported Rust, the rust-version
  # in Cargo.toml
  msrv:
    name: Check minimum Rust version
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v10.3.0
      with:
        version: "latest"

    - name: Read rust-version
      id: msrv
      run: echo "version=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

    - name: Install Rust ${{ steps.msrv.outputs.version }}
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ steps.msrv.outputs.version }}

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2

    # pyo3's build script needs a Python interpreter
    - name: Check
      run: |
        uv venv --python 3.11
        uv run --no-sync cargo check --locked --all-targets

  # Install the wheel built above and run the Python tests against it. No
  # Rust is compiled here
  test:
    name: Test (${{ matrix.os }}, ${{ matrix.python-version }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v10.3.0
      with:
        version: "latest"
        enable-cache: true
        cache-dependency-glob: "**/uv.lock"
        cache-suffix: "${{ matrix.os }}-py${{ matrix.python-version }}"

    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}

    - name: Download wheel
      uses: actions/download-artifact@v8
      with:
        name: wheel-${{ matrix.os }}
        path: dist

    # Dev dependencies only, then the built wheel in place of an editable
    # build of the project. Bash, so the wildcard expands on Windows too
    - name: Install dependencies and the wheel
      shell: bash
      run: |
        uv sync --dev --no-install-project --python ${{ matrix.python-version }}
        uv pip install dist/*.whl

    - name: Show which extension is tested
      run: uv run --no-sync python -c "import piicleaner._internal as m; print(m.__file__)"

    - name: Run Python tests
      run: uv run --no-sync pytest -v -m "not performance"
